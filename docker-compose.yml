services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      target: dev
    container_name: workpilot_auth_service
    restart: unless-stopped
    env_file:
    - ./auth-service/.env
    ports:
    - 8001:8000
    volumes:
    - ./auth-service:/app/auth-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/auth-service/.venv
    working_dir: /app/auth-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    - ANALYTICS_SERVICE_URL=http://analytics-service:8000
    command: 'sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host
      0.0.0.0 --port 8000 --reload"

      '
  hr-service:
    build:
      context: .
      dockerfile: hr-service/Dockerfile
      target: dev
    container_name: workpilot_hr_service
    restart: unless-stopped
    env_file:
    - ./hr-service/.env
    ports:
    - 8002:8000
    volumes:
    - ./hr-service:/app/hr-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/hr-service/.venv
    working_dir: /app/hr-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    command: 'sh -c "uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

      '
  it-service:
    build:
      context: .
      dockerfile: it-service/Dockerfile
      target: dev
    container_name: workpilot_it_service
    restart: unless-stopped
    env_file:
    - ./it-service/.env
    ports:
    - 8004:8000
    volumes:
    - ./it-service:/app/it-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/it-service/.venv
    working_dir: /app/it-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    command: 'sh -c "uv run uvicorn src.it_service.main:app --host 0.0.0.0 --port
      8000 --reload"

      '
  workflow-service:
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
      target: dev
    container_name: workpilot_workflow_service
    restart: unless-stopped
    env_file:
    - ./workflow-service/.env
    ports:
    - 8006:8000
    volumes:
    - ./workflow-service:/app/workflow-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/workflow-service/.venv
    working_dir: /app/workflow-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    command: 'sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"'
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      target: dev
    container_name: workpilot_notification_service
    restart: unless-stopped
    env_file:
    - ./notification-service/.env
    ports:
    - 8005:8000
    volumes:
    - ./notification-service:/app/notification-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/notification-service/.venv
    working_dir: /app/notification-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    command: 'sh -c "uv run alembic upgrade head && uv run uvicorn src.notification_service.main:app --host 0.0.0.0 --port 8000 --reload"

      '
  frontend:
    profiles:
      - frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: workpilot_frontend
    restart: unless-stopped
    depends_on:
    - auth-service
    ports:
    - 3000:3000
    volumes:
    - ./frontend:/app
    - /app/node_modules
    - /app/.next
    environment:
    - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8001
    - ANALYTICS_INTERNAL_URL=http://analytics-service:8000
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    command: npm run dev
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
      target: dev
    container_name: workpilot_ai_service
    restart: unless-stopped
    env_file:
    - ./ai-service/.env
    ports:
    - 8003:8000
    volumes:
    - ./ai-service:/app/ai-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/ai-service/.venv
    working_dir: /app/ai-service
    environment:
    - PYTHONPATH=/app/ai-service/src
    - WATCHFILES_FORCE_POLLING=true
    command: sh -c "uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
      target: dev
    container_name: workpilot_analytics_service
    restart: unless-stopped
    env_file:
    - ./analytics-service/.env
    ports:
    - 8007:8000
    volumes:
    - ./analytics-service:/app/analytics-service
    - ./packages/shared-infrastructure:/app/packages/shared-infrastructure
    - /app/analytics-service/.venv
    working_dir: /app/analytics-service
    environment:
    - WATCHFILES_FORCE_POLLING=true
    command: 'sh -c "uv run python run_mig.py && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"'
  
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: workpilot_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - 9092:9092
      - 29092:29092
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: workpilot_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.1
    container_name: workpilot_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

