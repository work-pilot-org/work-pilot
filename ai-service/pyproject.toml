[project]
name = "ai-service"
version = "0.1.0"
description = "WorkPilot AI Service"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # FastAPI
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    # Database
    "sqlalchemy>=2.0.41",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",
    # Validation & Settings
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    # Environment Variables
    "python-dotenv>=1.1.1",
    # Forms & File Uploads
    "python-multipart>=0.0.20",
    # HTTP Client (Microservice Communication)
    "httpx>=0.28.1",
    # Redis
    "redis>=6.2.0",
    # Logging
    "structlog>=25.4.0",
    # JWT
    "python-jose[cryptography]>=3.3.0",
    # Google Gemini SDK
    "google-genai>=1.30.0",
    "shared-infrastructure",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "mypy>=1.17.0",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "B008",   # FastAPI Depends
    "E501",   # Line too long
    "UP042",  # Enum inheritance
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
shared-infrastructure = { workspace = true }
